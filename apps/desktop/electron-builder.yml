appId: com.bullebrowser.app
productName: BulleBrowser
executableName: BulleBrowser
copyright: Copyright © 2026 BulleBrowser

directories:
  output: release
  buildResources: resources

afterPack: ./scripts/after-pack.cjs

files:
  - out/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/*.{ts,tsx,map}"
  - "!**/coverage/**"
  - "!**/{test,tests,__tests__,.vitest}/**"
  - "!**/{tsconfig.json,tsconfig.*.json,vitest.config.*,.eslintrc*,eslint.config.*}"

asar: false
asarUnpack:
  - resources/**

mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: true
  artifactName: "${productName}-${version}-${arch}.${ext}"
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: resources/icon.icns


win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: resources/icon.ico
  publisherName: BulleBrowser

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"

linux:
  category: Network
  artifactName: "${productName}-${version}-${arch}.${ext}"
  maintainer: BulleBrowser <hello@bullebrowser.com>
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  icon: resources/icon.png
  desktop:
    Name: BulleBrowser
    Comment: The agentic AI web browser
    Categories: Network;WebBrowser;


publish:
  provider: github
  owner: wardere83
  repo: bullebrowser
  releaseType: release
