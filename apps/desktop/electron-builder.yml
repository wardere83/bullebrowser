appId: com.bulleconsulting.bullebrowser
productName: BulleBrowser
executableName: BulleBrowser
copyright: Copyright © 2026 Bulle Consulting

directories:
  output: release
  buildResources: resources

afterPack: ./scripts/after-pack.cjs
# Notarize (via Apple's notarytool), staple, and Gatekeeper-validate the signed
# .app. No-op on non-mac and on unsigned/ad-hoc builds; hard-fails a tagged
# release that isn't properly Developer ID–signed. See scripts/notarize.cjs.
afterSign: ./scripts/notarize.cjs

files:
  - out/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/*.{ts,tsx,map}"
  - "!**/coverage/**"
  - "!**/{test,tests,__tests__,.vitest}/**"
  - "!**/{tsconfig.json,tsconfig.*.json,vitest.config.*,.eslintrc*,eslint.config.*}"
  # pdf.js is used only to read text from PDFs. Ship its Node build and
  # character maps; leave out the viewer, the script sandbox, fonts and WASM
  # decoders, none of which are loaded.
  - "!**/node_modules/pdfjs-dist/{build,web,wasm,image_decoders,standard_fonts,iccs,types}/**"
  - "!**/node_modules/pdfjs-dist/legacy/web/**"
  - "!**/node_modules/pdfjs-dist/legacy/build/{pdf.min.mjs,pdf.worker.min.mjs,pdf.sandbox.mjs,pdf.sandbox.min.mjs}"

asar: false
npmRebuild: false
asarUnpack:
  - resources/**

mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  # Drives the macOS microphone-consent prompt for Voice input / Voice Mode.
  # Paired with com.apple.security.device.audio-input in the entitlements.
  extendInfo:
    NSMicrophoneUsageDescription: >-
      BulleBrowser uses the microphone while you use dictation or Voice Mode
      to transcribe your speech and have a live spoken conversation.
  # We run our own spctl/stapler Gatekeeper check after notarization (a signed
  # but not-yet-notarized app fails spctl, so an in-pack assess would break the
  # build before notarization even runs). See scripts/notarize.cjs.
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  # Notarization is driven explicitly by the afterSign hook (notarytool), so
  # electron-builder must not also attempt it.
  notarize: false
  artifactName: "${productName}-${version}-${arch}.${ext}"
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: resources/icon.icns


win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: resources/icon.ico
  publisherName: Bulle Consulting

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"

linux:
  category: Network
  artifactName: "${productName}-${version}-${arch}.${ext}"
  maintainer: Bulle Consulting <hello@bulleconsulting.com>
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  icon: resources/icon.png
  desktop:
    Name: BulleBrowser
    Comment: The agentic AI web browser
    Categories: Network;WebBrowser;


publish:
  provider: github
  owner: wardere83
  repo: bullebrowser
  releaseType: release
