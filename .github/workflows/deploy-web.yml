name: deploy-web

# Builds the Next.js landing page as a static export and publishes it to
# GitHub Pages. No third-party host required.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/brand-tokens/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter @bullebrowser/web typecheck

      # Served at the bullebrowser.com custom domain (pinned by
      # apps/web/public/CNAME). Root base path; GitHub Pages will
      # auto-provision an HTTPS certificate via Let's Encrypt once the
      # domain is verified. Enable "Enforce HTTPS" in Settings → Pages
      # after the cert is issued.
      - name: Build static export
        run: pnpm --filter @bullebrowser/web build
        env:
          NEXT_PUBLIC_BASE_PATH: ''

      # enablement: true turns GitHub Pages ON automatically (build type =
      # GitHub Actions) if it isn't already — no manual Settings toggle.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
