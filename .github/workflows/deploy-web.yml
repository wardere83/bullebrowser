name: deploy-web

# Builds the Next.js landing page as a static export and publishes it to
# GitHub Pages. No third-party host required.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/brand-tokens/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'
  # Desktop releases dispatch this after all release assets finish uploading,
  # so the download manifest includes the newly published installers.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      # Keep the name from this build attempt when only deployment is retried.
      artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup@v4 reads the version from the
      # root package.json's "packageManager" field. Setting both fails the
      # step with ERR_PNPM_BAD_PM_VERSION, which is why every deploy run
      # since this workflow last set version: 9 has aborted before build.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter @bullebrowser/web typecheck

      # Served at the custom domain bullebrowser.com — apps/web/public/CNAME
      # carries the domain into the published artifact and the DNS is pointed
      # at GitHub Pages, so assets/links resolve at the domain root (no base
      # path). To revert to the project URL (wardere83.github.io/bullebrowser),
      # remove the CNAME and set NEXT_PUBLIC_BASE_PATH=/bullebrowser here.
      - name: Build static export
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @bullebrowser/web build

      # The site is not published if its copy breaks a rule it has to keep:
      # terminology, matching translations, one h1 per exported page.
      - name: Check copy rules
        run: pnpm --filter @bullebrowser/web test

      # enablement: true turns GitHub Pages ON automatically (build type =
      # GitHub Actions) if it isn't already — no manual Settings toggle.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
