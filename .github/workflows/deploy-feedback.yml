name: deploy-feedback

# Publishes the feedback receiver (services/feedback) to Cloudflare Workers on
# the free plan, at https://feedback.bullebrowser.com. It needs two repository
# secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see
# services/feedback/README.md). Until both exist the job only runs the tests.

on:
  push:
    branches: [main]
    paths:
      - 'services/feedback/**'
      - '.github/workflows/deploy-feedback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-feedback
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER: npx --yes wrangler@4.168.0
    defaults:
      run:
        working-directory: services/feedback
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the receiver
        run: node --test worker.test.mjs

      - name: Check for Cloudflare access
        id: access
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Feedback receiver not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then run this workflow again."
          fi

      - name: Create the database on first run
        if: steps.access.outputs.ready == 'true'
        run: |
          find_id() {
            $WRANGLER d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const db=JSON.parse(s).find(d=>d.name==='bullebrowser-feedback');process.stdout.write(db?(db.uuid||db.id||''):'')})"
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            $WRANGLER d1 create bullebrowser-feedback
            id="$(find_id)"
          fi
          if [ -z "$id" ]; then echo "::error::The feedback database could not be found or created."; exit 1; fi
          sed -i "s/DATABASE_ID_SET_BY_DEPLOY/$id/" wrangler.toml
          $WRANGLER d1 execute bullebrowser-feedback --remote --file schema.sql --yes

      - name: Deploy
        if: steps.access.outputs.ready == 'true'
        run: $WRANGLER deploy

      - name: Keep stored addresses unreadable
        if: steps.access.outputs.ready == 'true'
        run: |
          if ! $WRANGLER secret list --format json | grep -q '"LIMIT_SALT"'; then
            openssl rand -hex 32 | $WRANGLER secret put LIMIT_SALT
          fi

      - name: Check it answers
        if: steps.access.outputs.ready == 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://feedback.bullebrowser.com/health; then exit 0; fi
            sleep 15
          done
          echo "::warning::Deployed, but https://feedback.bullebrowser.com is not answering yet. A new domain can take a few minutes."
