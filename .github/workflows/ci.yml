name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - name: Guard workflow condition syntax (no secrets in step-level if)
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '^\s*if:\s*.*\bsecrets\.' .github/workflows/*.yml; then
            echo 'Found forbidden step-level if: expression referencing secrets.* in workflow files'
            echo 'Use a probe step + outputs/env values instead of secrets in if conditions.'
            exit 1
          fi
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - name: Tests with coverage gate
        run: pnpm --filter @bullebrowser/agent-core test
      - name: Desktop unit tests
        run: pnpm --filter @bullebrowser/desktop test
      - name: Web build smoke
        run: pnpm --filter @bullebrowser/web build
      - name: Web copy rules (terminology, translations, exported pages)
        run: pnpm --filter @bullebrowser/web test
      - name: Desktop build smoke
        run: pnpm --filter @bullebrowser/desktop build

  native-voice:
    name: Native speech (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check host runtime and both CPU variants
        run: pnpm --filter @bullebrowser/desktop exec node scripts/check-native-install.mjs
      - name: Check native updater restart behavior
        run: pnpm --filter @bullebrowser/desktop exec node --test scripts/updater-relaunch-check.cjs
      - name: Intel Mac desktop build
        if: matrix.os == 'macos-15-intel'
        run: pnpm --filter @bullebrowser/desktop build
      - name: Intel Mac desktop smoke
        if: matrix.os == 'macos-15-intel'
        run: pnpm --filter @bullebrowser/desktop test:e2e
