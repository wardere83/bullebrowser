name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - name: Dependency security and compatibility contracts
        run: node --test scripts/security-dependencies.test.mjs
      - name: Guard workflow condition syntax (no secrets in step-level if)
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '^\s*if:\s*.*\bsecrets\.' .github/workflows/*.yml; then
            echo 'Found forbidden step-level if: expression referencing secrets.* in workflow files'
            echo 'Use a probe step + outputs/env values instead of secrets in if conditions.'
            exit 1
          fi
      - name: Guard product language in tracked source
        run: |
          node scripts/check-product-language.mjs
          node scripts/check-privacy-claims.mjs
          node --test scripts/check-privacy-claims.test.mjs
      - name: Architecture source paths
        run: node --test scripts/architecture-paths.test.mjs
      - run: pnpm -r typecheck
      - name: Type-check funding evaluator harness
        working-directory: apps/desktop
        run: pnpm exec tsc --noEmit --target ES2023 --module ESNext --moduleResolution Bundler --jsx react-jsx --skipLibCheck --strict benchmark.config.ts benchmarks/funding.spec.ts
      - run: pnpm -r lint
      - name: Tests with coverage gate
        run: pnpm --filter @bullebrowser/agent-core test
      - name: Agent benchmark gate contracts
        run: node --test scripts/agent-benchmark-gate.test.mjs scripts/run-agent-benchmarks.test.mjs scripts/benchmark-workflow.test.mjs benchmarks/evaluator/score.test.mjs benchmarks/evaluator/preflight.test.mjs
      - name: Desktop unit tests
        run: pnpm --filter @bullebrowser/desktop test
      - name: Widget authorization tests
        run: |
          node services/widget-backend/build.mjs
          node --test services/widget-backend/*.test.mjs
      - name: Shared cloud authentication and billing safety tests
        run: |
          node --test services/cloud/cloud.test.mjs
          node services/cloud/build.mjs
      - name: Web build smoke
        run: pnpm --filter @bullebrowser/web build
      - name: Web copy rules (terminology, translations, exported pages)
        run: pnpm --filter @bullebrowser/web test
      - name: Desktop build smoke
        run: pnpm --filter @bullebrowser/desktop build
      - name: Guard product language in shipped desktop bundles
        run: node scripts/check-product-language.mjs apps/desktop/out

  native-voice:
    name: Native speech (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check host runtime and both CPU variants
        run: pnpm --filter @bullebrowser/desktop exec node scripts/check-native-install.mjs
      - name: Check native updater restart behavior
        run: pnpm --filter @bullebrowser/desktop exec node --test scripts/updater-relaunch-check.cjs
      - name: Intel Mac desktop build
        if: matrix.os == 'macos-15-intel'
        run: pnpm --filter @bullebrowser/desktop build
      - name: Intel Mac desktop smoke
        if: matrix.os == 'macos-15-intel'
        run: pnpm --filter @bullebrowser/desktop test:e2e
