name: build-desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
          - os: windows-2022
            target: win
          - os: ubuntu-22.04
            target: linux
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Stamping all package.json files to $VERSION (from tag $GITHUB_REF_NAME)"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of [
              "package.json",
              "apps/desktop/package.json",
              "apps/web/package.json",
              "packages/agent-core/package.json",
              "packages/brand-tokens/package.json",
            ]) {
              if (!fs.existsSync(f)) continue;
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              p.version = v;
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
              console.log(`  ${f} -> ${v}`);
            }
          ' "$VERSION"
          # Sanity-check: electron-builder reads this one for installer filenames + latest*.yml
          node -p "require('./apps/desktop/package.json').version"

      - name: Type-check, lint, and test
        run: |
          pnpm -r typecheck
          pnpm --filter @bullebrowser/agent-core test

      - name: Build desktop renderer + main
        run: pnpm --filter @bullebrowser/desktop build

      # GitHub Actions rejects `secrets.X` in step-level `if:` expressions
      # (the secrets context is only usable inside `${{ }}` env values).
      # Probe the cert into an env var first and gate later steps on its
      # presence — this is what was blocking every build since v0.1.3,
      # producing failed runs with 0 jobs spawned.
      - name: Probe macOS signing secrets
        if: matrix.target == 'mac'
        id: mac_secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "have_cert=1" >> "$GITHUB_OUTPUT"
          else
            echo "have_cert=0" >> "$GITHUB_OUTPUT"
          fi

      # macOS code signing + notarization
      - name: Import Apple certificate (macOS)
        if: matrix.target == 'mac' && steps.mac_secrets.outputs.have_cert == '1'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm certificate.p12

      # Don't hard-fail when signing secrets are absent — fall back to the
      # ad-hoc signature from afterPack so a Mac asset is always produced.
      # When the secrets ARE set, the import + package steps notarize normally.
      - name: Check macOS signing and notarization secrets
        if: matrix.target == 'mac'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::macOS signing/notarization secrets are missing — building an ad-hoc-signed, un-notarized app. Gatekeeper will require users to right-click → Open. Set MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID to ship a notarized build."
          else
            echo "macOS signing and notarization secrets present — will sign and notarize."
          fi

      - name: Build & sign macOS installer
        if: matrix.target == 'mac'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEYCHAIN: build.keychain
        run: pnpm --filter @bullebrowser/desktop package:mac


      - name: Build & sign Windows installer
        if: matrix.target == 'win'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
            [IO.File]::WriteAllBytes("$PWD/cert.pfx", $bytes)
            $env:CSC_LINK = "$PWD/cert.pfx"
            $env:CSC_KEY_PASSWORD = $env:WINDOWS_CERTIFICATE_PASSWORD
          }
          pnpm --filter @bullebrowser/desktop package:win

      - name: Build Linux installers
        if: matrix.target == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @bullebrowser/desktop package:linux

      - name: Compute SHA-256 checksums
        shell: bash
        run: |
          cd apps/desktop/release
          shopt -s nullglob
          : > checksums-${{ matrix.target }}.txt
          for f in *.dmg *.zip *.exe *.AppImage *.deb; do
            if [ -f "$f" ]; then
              if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi >> checksums-${{ matrix.target }}.txt
            fi
          done
          cat checksums-${{ matrix.target }}.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: bullebrowser-${{ matrix.target }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/checksums-*.txt
            apps/desktop/release/latest*.yml
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Combine checksums
        run: |
          mkdir -p release-assets
          find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' -o -name 'latest*.yml' \) -exec cp {} release-assets/ \;
          cat dist/**/checksums-*.txt > release-assets/checksums.txt || true
          ls -la release-assets

      - name: Generate release notes from Conventional Commits
        id: notes
        run: |
          last_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$last_tag" ]; then
            range="HEAD"
          else
            range="${last_tag}..HEAD"
          fi
          {
            echo "## Highlights"
            echo ""
            git log --pretty=format:'- %s' "$range" | grep -E '^- (feat|fix|perf|refactor|docs|chore)\(' || echo "- (no Conventional Commits in range)"
            echo ""
            echo "Full diff: ${last_tag:-(initial)}...${GITHUB_REF_NAME}"
          } > notes.md
          echo "path=notes.md" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
