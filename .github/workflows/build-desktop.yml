name: build-desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, e.g. 0.2.0) for manual publish.'
        required: false
        type: string
      publish_release:
        description: 'Publish GitHub Release after build artifacts complete.'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The mac job notarizes twice (arm64 + x64) and each submission now waits at
    # most 20m with one retry, so a healthy run finishes well inside this. The
    # cap stops a wedged runner from burning the default 6h and, worse, dying
    # mid-matrix with only one architecture published (see v0.2.16's missing
    # Intel DMG).
    timeout-minutes: 90
    # "1" when this run publishes a release (tag push, or a manual dispatch with
    # publish_release=true) — used to hard-fail unsigned/un-notarized macOS builds.
    env:
      IS_RELEASE: ${{ (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')) && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
          - os: windows-2022
            target: win
          - os: ubuntu-22.04
            target: linux
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Validate manual release inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ github.event.inputs.version }}'
          PUBLISH='${{ github.event.inputs.publish_release }}'

          if [[ "$PUBLISH" == "true" && -z "$VERSION" ]]; then
            echo "publish_release=true requires a non-empty version input"
            exit 1
          fi

          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version input must be semver without leading v (example: 0.2.0)"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
        shell: bash
        run: |
          set -e
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Stamping all package.json files to $VERSION (from tag $GITHUB_REF_NAME)"
          else
            VERSION="${{ github.event.inputs.version }}"
            echo "Stamping all package.json files to $VERSION (from workflow_dispatch input)"
          fi
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of [
              "package.json",
              "apps/desktop/package.json",
              "apps/web/package.json",
              "packages/agent-core/package.json",
              "packages/brand-tokens/package.json",
            ]) {
              if (!fs.existsSync(f)) continue;
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              p.version = v;
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
              console.log(`  ${f} -> ${v}`);
            }
          ' "$VERSION"
          # Sanity-check: electron-builder reads this one for installer filenames + latest*.yml
          node -p "require('./apps/desktop/package.json').version"

      # Automatic releases (auto-release.yml dispatches this against the new
      # tag) go straight to every installed app, which installs them on launch
      # — so there a failing check or build must stop the release. Only a
      # hand-pushed tag keeps the old leniency.
      - name: Type-check, lint, and test
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
        run: |
          pnpm -r typecheck
          pnpm --filter @bullebrowser/agent-core test
          pnpm --filter @bullebrowser/desktop test

      - name: Build desktop renderer + main
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
        run: pnpm --filter @bullebrowser/desktop build

      # GitHub Actions rejects `secrets.X` in step-level `if:` expressions
      # (the secrets context is only usable inside `${{ }}` env values).
      # Probe the cert into an env var first and gate later steps on its
      # presence — this is what was blocking every build since v0.1.3,
      # producing failed runs with 0 jobs spawned.
      - name: Probe macOS signing secrets
        if: matrix.target == 'mac'
        id: mac_secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "have_cert=1" >> "$GITHUB_OUTPUT"
          else
            echo "have_cert=0" >> "$GITHUB_OUTPUT"
          fi

      # macOS code signing + notarization
      - name: Import Apple certificate (macOS)
        if: matrix.target == 'mac' && steps.mac_secrets.outputs.have_cert == '1'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm certificate.p12

      # On a tagged release the build MUST be Developer ID–signed + notarized,
      # so hard-fail when the secrets are absent. On non-tag runs (PRs,
      # workflow_dispatch) fall back to the ad-hoc signature from afterPack so a
      # Mac asset is still produced for testing.
      - name: Check macOS signing and notarization secrets
        if: matrix.target == 'mac'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          have_apple_id=1
          [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ] && have_apple_id=0
          have_api_key=1
          [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ] && have_api_key=0
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ] || { [ "$have_apple_id" = "0" ] && [ "$have_api_key" = "0" ]; }; then
            if [ "$IS_RELEASE" = "1" ]; then
              echo "::error::macOS signing/notarization secrets are missing on a release run. Refusing to publish an un-notarized build."
              exit 1
            fi
            echo "::warning::macOS signing/notarization secrets are missing — this run will produce an ad-hoc-signed, un-notarized macOS build."
          else
            echo "macOS signing and notarization secrets present — will sign and notarize."
          fi

      # Fail fast (in seconds) if the cert is the wrong type or notarytool auth
      # is bad, instead of discovering it deep into the ~build. Runs only when a
      # certificate was imported.
      - name: Preflight — verify signing identity & notarization auth
        if: matrix.target == 'mac' && steps.mac_secrets.outputs.have_cert == '1'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -uo pipefail
          fail=0

          # 1. A Developer ID Application identity must exist in the keychain.
          echo "== codesigning identities in build.keychain =="
          security find-identity -v -p codesigning build.keychain || true
          if security find-identity -v -p codesigning build.keychain | grep -q "Developer ID Application"; then
            echo "OK: Developer ID Application certificate present."
          else
            echo "::error::No 'Developer ID Application' identity found. The .p12 is the wrong certificate type (needs Developer ID Application, not Apple Development / Mac App Distribution) or is missing its private key."
            fail=1
          fi

          # 2. notarytool must authenticate with whichever credential set is set.
          notary_ok=0
          if [ -n "${APPLE_API_KEY_B64:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
            echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            if xcrun notarytool history --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" >/dev/null 2>&1; then
              echo "OK: notarytool authenticated (App Store Connect API key)."
              notary_ok=1
            else
              echo "::error::notarytool rejected the App Store Connect API key (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER)."
            fi
            rm -f "$RUNNER_TEMP/AuthKey.p8"
          elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            if xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" >/dev/null 2>&1; then
              echo "OK: notarytool authenticated (Apple ID)."
              notary_ok=1
            else
              echo "::error::notarytool rejected the Apple ID credentials (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID)."
            fi
          else
            echo "::warning::No complete notarization credential set is configured."
          fi
          [ "$notary_ok" = "1" ] || fail=1

          if [ "$fail" != "0" ]; then
            if [ "$IS_RELEASE" = "1" ]; then
              echo "::error::Signing/notarization preflight failed — aborting before the build."
              exit 1
            fi
            echo "::warning::Preflight found issues (tolerated on non-release runs)."
          else
            echo "Preflight passed — ready to sign and notarize."
          fi

      # Publish only from the final release job, after every platform succeeds.
      # electron-builder otherwise publishes per-platform as soon as it finishes.
      - name: Build, sign & notarize macOS installer
        if: matrix.target == 'mac'
        # Fail the job on a release run if signing/notarization fails; tolerate
        # failures on non-release runs so a broken cert doesn't block PR builds.
        continue-on-error: ${{ env.IS_RELEASE != '1' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # App Store Connect API-key notarization (preferred when set). The key
          # itself is a base64-encoded .p8 decoded to a temp file below.
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Point electron-builder at the imported keychain when we have a cert.
          # Otherwise disable identity auto-discovery so it produces an unsigned
          # .app that the afterPack hook ad-hoc signs (dev/PR fallback).
          if [ "${{ steps.mac_secrets.outputs.have_cert }}" = "1" ]; then
            export CSC_KEYCHAIN=build.keychain
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          # Materialize the App Store Connect API key (.p8) for notarytool.
          if [ -n "$APPLE_API_KEY_B64" ]; then
            echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          fi
          pnpm --filter @bullebrowser/desktop package:mac --publish never
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Independent post-build check on the produced .app bundles (the afterSign
      # hook already validated, this guards against a partial/short-circuited
      # build). Hard-fails a tagged release that isn't signed + notarized +
      # stapled + Gatekeeper-accepted.
      - name: Verify macOS signature, notarization & Gatekeeper
        if: matrix.target == 'mac'
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          apps=(apps/desktop/release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            if [ "$IS_RELEASE" = "1" ]; then
              echo "::error::No macOS .app was produced on a release run."; exit 1
            fi
            echo "::warning::No .app bundle found to verify."; exit 0
          fi
          fail=0
          for app in "${apps[@]}"; do
            echo "== $app =="
            codesign --verify --deep --strict --verbose=2 "$app" || fail=1
            if codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application"; then
              echo "  Developer ID signature present — checking notarization staple + Gatekeeper"
              xcrun stapler validate "$app" || fail=1
              spctl --assess --type execute --verbose=4 "$app" || fail=1
            else
              echo "::warning::$app is not Developer ID-signed (ad-hoc/unsigned build)."
              [ "$IS_RELEASE" = "1" ] && fail=1
            fi
          done
          if [ "$fail" != "0" ] && [ "$IS_RELEASE" = "1" ]; then
            echo "::error::macOS signature/notarization/Gatekeeper verification failed for a release run."
            exit 1
          fi
          if [ "$fail" = "0" ]; then
            echo "macOS artifacts verified: signed, notarized, stapled, Gatekeeper-accepted."
          else
            echo "::warning::Verification issues on a non-release build (tolerated)."
          fi

      - name: Build & sign Windows installer
        if: matrix.target == 'win'
        continue-on-error: ${{ env.IS_RELEASE != '1' }}
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
            [IO.File]::WriteAllBytes("$PWD/cert.pfx", $bytes)
            $env:CSC_LINK = "$PWD/cert.pfx"
            $env:CSC_KEY_PASSWORD = $env:WINDOWS_CERTIFICATE_PASSWORD
          }
          pnpm --filter @bullebrowser/desktop package:win --publish never

      - name: Build Linux installers
        if: matrix.target == 'linux'
        continue-on-error: ${{ env.IS_RELEASE != '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @bullebrowser/desktop package:linux --publish never

      - name: Compute SHA-256 checksums
        if: always()
        shell: bash
        run: |
          mkdir -p apps/desktop/release
          cd apps/desktop/release
          shopt -s nullglob
          : > checksums-${{ matrix.target }}.txt
          for f in *.dmg *.zip *.exe *.AppImage *.deb; do
            if [ -f "$f" ]; then
              if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi >> checksums-${{ matrix.target }}.txt
            fi
          done
          cat checksums-${{ matrix.target }}.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bullebrowser-${{ matrix.target }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/checksums-*.txt
            apps/desktop/release/latest*.yml
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    # No always(): if the build job fails (e.g. macOS signing/notarization did
    # not pass on a release run), this job is skipped and nothing is published —
    # so a partial or un-notarized release can never go out.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' && github.event.inputs.version != '')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          if-no-files-found: warn

      - name: Combine checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          mkdir -p release-assets
          find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' -o -name 'latest*.yml' -o -name '*.blockmap' \) -exec cp {} release-assets/ \;
          checksum_files=(dist/**/checksums-*.txt)
          if (( ${#checksum_files[@]} > 0 )); then
            cat "${checksum_files[@]}" > release-assets/checksums.txt
          else
            : > release-assets/checksums.txt
          fi
          ls -la release-assets

      - name: Generate release notes from Conventional Commits
        id: notes
        run: |
          last_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$last_tag" ]; then
            range="HEAD"
          else
            range="${last_tag}..HEAD"
          fi
          {
            echo "## Highlights"
            echo ""
            git log --pretty=format:'- %s' "$range" | grep -E '^- (feat|fix|perf|refactor|docs|chore)\(' || echo "- (no Conventional Commits in range)"
            echo ""
            echo "Full diff: ${last_tag:-(initial)}...${{ steps.release_meta.outputs.tag }}"
          } > notes.md
          echo "path=notes.md" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
          append_body: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
