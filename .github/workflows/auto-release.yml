name: auto-release

# Ships every change to the desktop app without anyone tagging by hand.
#
# Installed apps update themselves from GitHub Releases (see
# apps/desktop/src/main/updater.ts), but only when a release exists — and a
# release used to need someone to push a v*.*.* tag. Changes merged to main
# therefore sat unreleased, and people reinstalled to get them. Now a push to
# main that touches the app bumps the patch version, tags it, and starts
# build-desktop, whose release installed apps pick up on their next check.
#
# Skip a push by starting its commit subject (first line) with the marker
# [skip release]. Only the subject counts, so a message body can mention it.
# Pushing a v*.*.* tag by hand (e.g. for a minor or major bump) still works
# exactly as before.

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/agent-core/**'
      - 'packages/brand-tokens/**'
      - '!packages/brand-tokens/film/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/auto-release.yml'

permissions:
  contents: write # push the tag
  actions: write # start build-desktop

# One at a time, never cancelled: two quick pushes must get two versions, not
# the same number twice.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the next version
        id: version
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          subject=$(printf '%s\n' "$MESSAGE" | head -n 1)
          if [[ "$subject" == *"[skip release]"* ]]; then
            echo "Commit subject opts out of a release: $subject"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --force
          # Already released (e.g. a hand-pushed tag on this commit): nothing to do.
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD is already tagged: $(git tag --points-at HEAD | tr '\n' ' ')"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          next="$major.$minor.$((patch + 1))"
          echo "latest=$latest next=v$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "skip=0" >> "$GITHUB_OUTPUT"

      # Tag first, so the version is claimed before the (long) build starts and
      # a second push can't pick the same number. A tag pushed with
      # GITHUB_TOKEN deliberately starts no workflows, so the build is started
      # explicitly below — workflow_dispatch is the one event that token may
      # trigger.
      - name: Tag the release
        if: steps.version.outputs.skip == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v${{ steps.version.outputs.next }}" -m "Release v${{ steps.version.outputs.next }}" "$GITHUB_SHA"
          git push origin "v${{ steps.version.outputs.next }}"

      - name: Build and publish
        if: steps.version.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-desktop.yml \
            --ref "v${{ steps.version.outputs.next }}" \
            -f version="${{ steps.version.outputs.next }}" \
            -f publish_release=true
          echo "Started build-desktop for v${{ steps.version.outputs.next }}."
